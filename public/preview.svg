<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#050510"/>
  <!-- Background grad -->
  <ellipse cx="600" cy="200" rx="500" ry="300" fill="url(#bgGlow)" opacity="0.3"/>
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#4876c8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7a9a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#030a1a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Water surface -->
  <ellipse cx="600" cy="380" rx="400" ry="160" fill="url(#waterGrad)" opacity="0.5"/>
  <!-- Lotus petals -->
  <g transform="translate(600, 340)">
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(0)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(45)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(90)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(135)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(180)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(225)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(270)"/>
    <ellipse cx="0" cy="-20" rx="50" ry="12" fill="#d4508a" opacity="0.85" transform="rotate(315)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#e8709a" opacity="0.9" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#e8709a" opacity="0.9" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#e8709a" opacity="0.9" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#e8709a" opacity="0.9" transform="rotate(157.5)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#e8709a" opacity="0.9" transform="rotate(202.5)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#e8709a" opacity="0.9" transform="rotate(247.5)"/>
    <circle cx="0" cy="-8" r="8" fill="#ffd700" opacity="0.9"/>
    <!-- Glowing sphere -->
    <circle cx="0" cy="-55" r="6" fill="#fff8e8" opacity="0.9"/>
    <circle cx="0" cy="-55" r="16" fill="#ffe8b0" opacity="0.15"/>
  </g>
  <!-- Particles -->
  <circle cx="520" cy="280" r="1.5" fill="#ffa0d0" opacity="0.6"/>
  <circle cx="650" cy="260" r="1" fill="#ffa0d0" opacity="0.4"/>
  <circle cx="560" cy="310" r="1.2" fill="#ffa0d0" opacity="0.5"/>
  <circle cx="680" cy="330" r="1.5" fill="#ffa0d0" opacity="0.3"/>
  <circle cx="540" cy="350" r="1" fill="#ffa0d0" opacity="0.5"/>
  <circle cx="630" cy="290" r="1.3" fill="#ffa0d0" opacity="0.4"/>
  <!-- "BUILT WITH RIMBLE.APP" text -->
  <text x="600" y="140" text-anchor="middle" fill="white" font-family="'Orbitron','Courier New',monospace" font-size="48" font-weight="900" letter-spacing="8" opacity="0.9">BUILT WITH</text>
  <text x="600" y="190" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Orbitron','Courier New',monospace" font-size="32" font-weight="700" letter-spacing="12" opacity="0.7">RIMBLE.APP</text>
  <!-- Glass card at bottom -->
  <rect x="350" y="440" width="500" height="170" rx="16" fill="rgba(10,10,42,0.4)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="600" y="468" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="2">LOVED BY SMALL BUSINESSES</text>
  <!-- Avatar circles -->
  <circle cx="560" cy="490" r="12" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="578" cy="490" r="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="596" cy="490" r="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="614" cy="490" r="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="632" cy="490" r="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Testimonial text -->
  <text x="600" y="520" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="12" opacity="0.7">&ldquo;Exactly the wow factor we needed for our brand launch.&rdquo;</text>
  <!-- Input form -->
  <rect x="380" y="545" width="440" height="44" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="400" y="572" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="12">Describe your website&hellip;</text>
  <rect x="720" y="550" width="86" height="34" rx="17" fill="white"/>
  <text x="763" y="571" text-anchor="middle" fill="#171717" font-family="sans-serif" font-size="12" font-weight="600">Build</text>
</svg>
